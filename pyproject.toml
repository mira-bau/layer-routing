[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saab-structural-attention"
version = "0.1.0"
description = "Reference implementation for Structure-Aware Attention Bias experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = [
  "numpy",
  "matplotlib",
  "pandas",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "tokenizers",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
